<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#d3131b"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Ziraat Mobil</title>
<style>
:root{--r:#d3131b;--rd:#a50d14;--bg:#f2f2f4;--t:#222;--m:#777;--g:#1b9e4b;--bd:#e3e3e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}html,body{margin:0;height:100%;background:#111;color:var(--t);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;max-width:480px;margin:auto;position:relative;background:var(--bg);overflow:hidden}
.scr{position:absolute;inset:0;overflow-y:auto;padding-bottom:5.5rem}
svg{display:block;flex:none}.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.red{background:radial-gradient(120% 60% at 20% 55%,#e01b22,transparent 60%),linear-gradient(160deg,#d3131b,#b50f16 60%,#d3131b);color:#fff}
.top{padding:calc(env(safe-area-inset-top) + .7rem) 1rem .8rem;display:flex;align-items:center;justify-content:space-between;min-height:3.4rem}
.lg{font-size:1.75rem;font-weight:800;letter-spacing:-.5px;display:flex;align-items:center;gap:.4rem}
.hd{background:var(--r);color:#fff;padding:calc(env(safe-area-inset-top) + .6rem) 1rem .9rem}
.hb{display:flex;align-items:center;justify-content:space-between;min-height:2.6rem}.hb b{font-size:1.1rem}.bk{width:2.6rem}
.bd{padding:1rem}
.card{background:#fff;border-radius:1rem;padding:1rem;margin-bottom:.9rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:.7rem}.sp{justify-content:space-between}
.fld{background:#fff;border:1px solid #ccc;border-radius:.7rem;padding:.5rem .8rem .3rem;margin-bottom:.8rem}
.fld:focus-within{border-color:var(--r);box-shadow:0 0 0 2px rgba(211,19,27,.2)}
.fld label{display:block;font-size:.78rem;color:var(--m)}.fld input,.fld select{width:100%;border:0;outline:0;background:none;font-size:1.05rem;padding:.2rem 0 .3rem;font-family:inherit;color:var(--t)}
.btn{width:100%;padding:.95rem;border:0;border-radius:99px;background:var(--r);color:#fff;font-size:1.05rem;font-weight:700;font-family:inherit;margin-top:.3rem}
.btn.w{background:#fff;color:#111}.btn.o{background:none;border:2px solid #fff}.btn.s{background:#fff;color:var(--r);border:1.5px solid var(--r)}
.btn:active{opacity:.8}
.tabs{display:flex;gap:1.3rem;border-bottom:1px solid var(--bd);background:#fff;padding:0 1rem}
.tabs span{padding:.9rem 0;font-weight:600;color:var(--m)}.tabs .on{color:var(--r);border-bottom:3px solid var(--r)}
.srch{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:.65rem 1rem;color:#fff;margin-top:.7rem;display:flex;gap:.5rem;align-items:center}
.br{color:var(--r);font-weight:700;font-size:1.05rem}
.tag{background:#e8dcc4;color:#6b5a30;border-radius:.4rem;padding:.15rem .6rem;font-size:.8rem;font-weight:600}
.iban{margin:.7rem 0;font-size:.98rem;display:flex;align-items:center;gap:.4rem}
.bl{display:flex;gap:1rem;font-size:.8rem;color:var(--m)}.bl b{display:block;color:var(--t);font-size:1.05rem;margin-top:.1rem}
.g2{display:flex;gap:.6rem;margin-top:1rem}.g2 .btn{margin:0;padding:.75rem;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
.grid>div{background:#fff;border-radius:1rem;padding:.9rem .3rem;text-align:center;font-size:.82rem;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid .ic{width:2.8rem;height:2.8rem;border-radius:50%;background:#fde8e9;color:var(--r);display:grid;place-items:center;margin:0 auto .45rem}
.tab{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid var(--bd);padding:.5rem 0 calc(env(safe-area-inset-bottom) + .4rem);z-index:5}
.tab div{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.75rem;font-weight:600;color:#555}.tab .on{color:var(--r)}
.tx{display:flex;align-items:center;gap:.7rem;padding:.8rem 1rem;background:#fff;border-bottom:1px solid var(--bd)}
.tx .c{width:2.5rem;height:2.5rem;border-radius:50%;background:#fde8e9;color:var(--r);display:grid;place-items:center;flex:none}
.tx .n{font-weight:600;overflow-wrap:anywhere}.tx .d{font-size:.8rem;color:var(--m)}.tx .a{margin-left:auto;font-weight:700;white-space:nowrap}
.pos{color:var(--g)}.dt{padding:.7rem 1rem .3rem;font-size:.82rem;color:var(--m);font-weight:600}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--bd)}.kv span:first-child{color:var(--m)}.kv span:last-child{text-align:right;overflow-wrap:anywhere;font-weight:600}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + .6rem);left:50%;transform:translate(-50%,-150px);background:#222;color:#fff;padding:.7rem 1.2rem;border-radius:99px;z-index:30;transition:.3s;max-width:92%;text-align:center;font-weight:600}
#toast.show{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:480px;background:#fff;border-radius:1.4rem 1.4rem 0 0;padding:1.3rem 1rem calc(env(safe-area-inset-bottom) + 1rem)}
.ok{width:5.5rem;height:5.5rem;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;margin:2.5rem auto 1rem}
.x{color:var(--r);font-size:1.3rem;padding:.2rem .5rem}
.ti{display:flex;gap:.8rem;overflow-x:auto;padding:0 1rem;scrollbar-width:none}
.ti div{flex:none;width:15rem;background:#fff;border:3px solid #fff;outline:2px solid #fff;border-radius:1rem;padding:.8rem;color:#222;font-weight:700;font-size:.9rem;display:flex;gap:.6rem;align-items:center}
.ti i{width:2.6rem;height:2.6rem;border-radius:50%;background:var(--r);flex:none}
.bt{position:absolute;left:0;right:0;bottom:0;background:#fff;display:flex;padding:.8rem .2rem calc(env(safe-area-inset-bottom) + .5rem);color:var(--r)}
.bt div{flex:1;text-align:center;font-size:.78rem;color:#222;display:flex;flex-direction:column;align-items:center;gap:.4rem}
.tog{width:3.2rem;height:1.9rem;border-radius:99px;background:#ccc;position:relative;flex:none}.tog:after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;transition:.2s}.tog.on{background:var(--g)}.tog.on:after{left:1.5rem}
h3{margin:.2rem 0 .7rem}
.lgi{height:2.1rem;width:auto;display:block}.wh{height:1.6rem;width:auto}
.btn,.card,.grid>div,.tx,.tab div{transition:transform .14s,background .14s,opacity .14s}
.btn:active{transform:scale(.96)}.card:active{transform:scale(.985)}.grid>div:active{transform:scale(.93)}.tx:active{background:#f4f4f6}
@keyframes sf{from{transform:translateX(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes sb{from{transform:translateX(-26%);opacity:0}to{transform:none;opacity:1}}
@keyframes su{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes ovf{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wave{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.scr.a-f{animation:sf .32s cubic-bezier(.2,.8,.2,1)}.scr.a-b{animation:sb .3s cubic-bezier(.2,.8,.2,1)}.scr.a-u{animation:su .35s cubic-bezier(.2,.8,.2,1)}
.s .card,.s .grid>div,.s .tx{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.s :nth-child(2){animation-delay:.04s}.s :nth-child(3){animation-delay:.08s}.s :nth-child(4){animation-delay:.12s}.s :nth-child(5){animation-delay:.16s}.s :nth-child(6){animation-delay:.2s}
.scr.w{background:linear-gradient(120deg,#d3131b,#a50d14,#e8212a,#b50f16);background-size:320% 320%;animation:wave 10s ease infinite}
.scr.w .lgi{animation:flt 4s ease-in-out infinite}
.scr.w .btn{animation:rise .6s .15s both}
.ov{animation:ovf .2s}.sh{animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
.ok{animation:pop .5s}.ok path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .3s forwards}
.tab .on svg{animation:pop .35s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function accrue(){
  const u=U(),c=u.cfg,now=Date.now();let ch=0,n=0;
  while(u.last+864e5<=now&&n<400){
    u.last+=864e5;n++;
    const b=bal('vdl');
    const amt=c.mode==='eur'?c.eurDay*c.rate:b*c.pct/100/365;
    if(amt>0){u.tx.push({id:u.last+Math.random(),t:u.last,acc:'vdl',amt:Math.round(amt*100)/100,n:'Faiz Geliri',s:c.mode==='eur'?`Günlük ${c.eurDay} EUR · Kur ${c.rate}`:`Yıllık %${c.pct} · günlük`,k:'faiz'});ch=1}
  }
  if(ch){u.mail.push({t:now,h:'Faiz Geliri',b:`Vadeli hesabınıza ${n} günlük faiz geliri yatırıldı.`});}
  if(ch||n)save();
}

function doReg(){
  const n=val('rn').trim(),l=val('rl').trim().toLowerCase(),p=val('rp');
  if(!n||!l)return toast('Lütfen tüm alanları doldurun');
  if(DB.users[l])return toast('Bu kullanıcı adı alınmış');
  if(!/^\d{4,}$/.test(p))return toast('Şifre en az 4 rakam olmalı');
  if(p!==val('rp2'))return toast('Şifreler eşleşmiyor');
  const b=num(val('rb')),s=num(val('rs')),k=num(val('rk')),e=num(val('re')),r=num(val('rr'));
  DB.users[l]={name:n,pin:p,no:rnd(8),br:BR[Math.floor(Math.random()*BR.length)],iban:fakeIban(),iban2:fakeIban(),base:{vad:isNaN(b)?0:b,vdl:isNaN(s)?0:s},tx:[],last:Date.now(),
   cfg:{rate:isNaN(k)||k<=0?50:k,mode:val('rm'),eurDay:isNaN(e)?2:e,pct:isNaN(r)?45:r},lock:false,
   mail:[{t:Date.now(),h:'Hoş geldiniz',b:'Ziraat Mobil erişiminiz başarıyla oluşturuldu.'}]};
  me=l;save();toast('Hoş geldiniz, '+n.split(' ')[0]);go('app','home')
}
function doLogin(){
  const l=val('ln').trim().toLowerCase(),u=DB.users[l];

 <div class="fld"><label>Alıcı</label><select onchange="sv();draft.own=this.value==='own'?1:0;render()"><option value="ext" ${own?'':'selected'}>Başka IBAN'a</option><option value="own" ${own?'selected':''}>Kendi hesabıma (${AN[from==='vad'?'vdl':'vad']})</option></select></div>

 if(!a)return toast('Tutar giriniz');

 return hd('Yönetici Menüsü')+`<div class="bd"><div class="card"><h3>Faiz &amp; Kur</h3>${fld('ck','1 EUR = ? TL',String(c.rate).replace('.',','),'inputmode="decimal"')}
